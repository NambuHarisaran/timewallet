name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the default token only needs to read the repo (S9).
permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs so a moved/compromised tag cannot
      # inject code into CI (S10). Bump by updating the SHA + comment together.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      # --enforce-lockfile: CI must build exactly what pubspec.lock records;
      # fail instead of silently resolving newer (potentially tampered) versions.
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
